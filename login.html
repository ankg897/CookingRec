<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Website - Login & Register</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="./assets/css/login.css">
    <style>
        .container {
            display: none;
        }
        
        .container.active {
            display: block;
        }
        
        .messageDiv {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            text-align: center;
            transition: opacity 0.5s ease;
        }
        
        .messageDiv.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .btn {
            cursor: pointer;
        }
        
        .google-btn {
            background: transparent;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- Sign Up Container -->
    <div class="container active" id="signup">
        <h1 class="form-title">Register</h1>
        <form method="post" action="">
            <div id="signUpMessage" class="messageDiv" style="display:none;"></div>
            
            <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text" id="fName" placeholder="First Name" required>
                <label for="fName">First Name</label>
            </div>
            
            <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text" id="lName" placeholder="Last Name" required>
                <label for="lName">Last Name</label>
            </div>
            
            <div class="input-group">
                <i class="fas fa-envelope"></i>
                <input type="email" id="rEmail" placeholder="Email" required>
                <label for="rEmail">Email</label>
            </div>
            
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="rPassword" placeholder="Password" required>
                <label for="rPassword">Password</label>
            </div>
            
            <button class="btn" id="submitSignUp" type="button">Sign Up</button>
        </form>
        
        <p class="or">----------or--------</p>
        
        <div class="icons">
            <button class="google-btn" onclick="signInWithGoogle()">
            </button>
        </div>
        
        <div class="links">
            <p>Already Have Account?</p>
            <button id="signInButton" type="button">Sign In</button>
        </div>
    </div>

    <!-- Sign In Container -->
    <div class="container" id="signIn">
        <h1 class="form-title">Sign In</h1>
        <form method="post" action="">
            <div id="signInMessage" class="messageDiv" style="display:none;"></div>

            <div class="input-group">
                <i class="fas fa-envelope"></i>
                <input type="email" id="email" placeholder="Email" required>
                <label for="email">Email</label>
            </div>
            
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="password" placeholder="Password" required>
                <label for="password">Password</label>
            </div>
            
            <p class="recover">
                <a href="#">Recover Password</a>
            </p>
            
            <button class="btn" id="submitSignIn" type="button">Sign In</button>
        </form>
        
        <p class="or">----------or--------</p>
        
        <div class="icons">
            <button class="google-btn" onclick="signInWithGoogle()">
                <i class="fab fa-google"></i>
            </button>
        </div>
        
        <div class="links">
            <p>Don't have account yet?</p>
            <button id="signUpButton" type="button">Sign Up</button>
        </div>
    </div>

    <script type="module" src="./assets/js/firebaseauth.js"></script>
    
    <script>
        // Function to switch between forms
        function showForm(formId) {
            // Hide all forms
            document.querySelectorAll('.container').forEach(form => {
                form.classList.remove('active');
            });
            
            // Show the selected form
            document.getElementById(formId).classList.add('active');
        }
        
        // Set up event listeners when the page loads
        document.addEventListener('DOMContentLoaded', function() {
            // Show sign in form by default
            showForm('signIn');
            
            // Add event listeners to toggle buttons
            document.getElementById('signUpButton').addEventListener('click', function() {
                showForm('signup');
            });
            
            document.getElementById('signInButton').addEventListener('click', function() {
                showForm('signIn');
            });
        });
    </script>
</body>
</html>
