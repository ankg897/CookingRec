<!--Filter bar-->
<div class="filter-bar" data-filter-bar>
    <div class="title-wrapper">
        <span class="material-symbols-outlined"
        aria-hidden="true">filter_list</span>

        <p class="title-medium">Filters</p>

            <span class="material-symbols-outlined" aria-hidden="true">close</span>
        </button>
    </div>
    <div class="filter-content">
    <div class="search-wrapper">
    <div class="input-outlined">
        <input type="search" name="search" id="search"
        placeholder="Search recipes"
        class="input-field body-large">
    </div>
    </div>
<div class="accordion-container" data-accordion>
<button class="accordion-btn has-state"
aria-controls="category" aria-expanded="false"
data-accordion-btn>
    <span class="material-symbols-outlined" aria-hidden="true">category</span>
    <p class="label-large">Category</p>
    <span class="material-symbols-outlined trailing-icon"
    aria-hidden="true">expand_more</span>
</button>
<div class="accordion-content" id="category">
    <div class="accordion-overflow" data-filter="category">
        <label class="filter-chip label-large">
            Beef

        </label>
        <label class="filter-chip label-large">
            Chicken

        <label class="filter-chip label-large">

        <label class="filter-chip label-large">
            Vegan

        </label>
        <label class="filter-chip label-large">
            Lamb
            <input type="radio" name="category" value="Lamb" class="checkbox">
        </label>
        <label class="filter-chip label-large">
            Miscellaneous
            <input type="radio" name="category" value="Miscellaneous" class="checkbox">
        </label>
    </div>
</div>
</div>
